name: SaaS One-Click Deploy

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Node API image
        uses: docker/build-push-action@v4
        with:
          context: ./deploy/arty-housekeeping/node-server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/arty-node:latest

      - name: Build and push Next app image
        uses: docker/build-push-action@v4
        with:
          context: ./deploy/arty-housekeeping/next-app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/arty-next:latest

      - name: Trigger Render deploy (optional)
        if: ${{ secrets.RENDER_API_KEY && secrets.RENDER_SERVICE_ID }}
        run: |
          echo 'Triggering Render deploy for service'
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}' \
            "https://api.render.com/deploys/service/${{ secrets.RENDER_SERVICE_ID }}"

      - name: Trigger Vercel deploy (optional)
        if: ${{ secrets.VERCEL_TOKEN && secrets.VERCEL_PROJECT_ID }}
        run: |
          echo 'Triggering Vercel deploy'
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"force": true}' \
            "https://api.vercel.com/v13/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}"

  post-deploy-checks:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Quick health check (Render)
        if: ${{ secrets.EXPRESS_URL }}
        run: |
          echo 'Checking API health'
          curl -fsS ${ { secrets.EXPRESS_URL } }/health || (echo 'Health check failed' && exit 1)
